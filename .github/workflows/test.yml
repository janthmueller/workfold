name: Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
        include:
          - os: macos-latest
            python-version: "3.14"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.28"
      - run: uv sync --locked --extra dev
      - run: uv run --locked ruff check .
      - run: uv run --locked ruff format --check .
      - run: uv run --locked pyright
      - run: uv run --locked pytest -q --cov --cov-report=term-missing

  minimum-runtime-dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
      - name: Install declared runtime floors
        run: |
          python -m pip install \
            "pathspec==1.0.0" \
            "rich==14.3.0" \
            "tzlocal==5.0" \
            "pytest>=8"
          python -m pip install --no-deps -e .
      - run: python -m pytest -q

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.28"
      - run: uv sync --locked --extra release
      - run: uv run --locked python -m build
      - run: uv run --locked python -m build compat/workfold --outdir dist
      - run: uv run --locked python -m twine check dist/*
      - name: Smoke-test wheel
        shell: bash
        run: |
          python -m venv wheel-smoke
          wheel-smoke/bin/python -m pip install dist/*.whl
          wheel-smoke/bin/wuf --version
          wheel-smoke/bin/workfold --version | grep -Eq '^wuf '
          FIXTURE="$(mktemp -d)"
          git -C "$FIXTURE" init --initial-branch=main
          git -C "$FIXTURE" config user.name "CI Fixture"
          git -C "$FIXTURE" config user.email "ci@example.test"
          echo activity > "$FIXTURE/work.txt"
          git -C "$FIXTURE" add work.txt
          GIT_AUTHOR_DATE="2026-08-03T10:00:00+02:00" GIT_COMMITTER_DATE="2026-08-03T10:00:00+02:00" git -C "$FIXTURE" commit -m "fixture activity"
          wheel-smoke/bin/wuf "$FIXTURE" --time all --timezone Europe/Berlin --no-color > wheel-report.txt
          grep -Eq '^Events[[:space:]]+1[[:space:]]*$' wheel-report.txt
      - name: Smoke-test source distribution
        shell: bash
        run: |
          python -m venv sdist-smoke
          sdist-smoke/bin/python -m pip install dist/*.tar.gz
          sdist-smoke/bin/wuf --version
          sdist-smoke/bin/wuf --help > /dev/null

  binaries:
    uses: ./.github/workflows/binaries.yml
    with:
      tag: v0.0.0
      checkout_ref: ${{ github.sha }}
      upload: false
    permissions:
      contents: read

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 11.11.0
      - working-directory: docs
        run: pnpm install --frozen-lockfile
      - working-directory: docs
        run: pnpm check
      - working-directory: docs
        run: pnpm build

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.28"
      - run: uv sync --locked --extra audit
      - run: uv run --locked python -m pip_audit .

  nix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: cachix/install-nix-action@8aa03977d8d733052d78f4e008a241fd1dbf36b3 # v31.10.6
      - run: nix flake check --print-build-logs

name: Build binaries manually

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag
        required: true
        type: string
      checkout_ref:
        description: Source ref to build instead of the release tag
        required: false
        default: ""
        type: string
      upload:
        description: Attach archives to the named GitHub release
        required: false
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  binaries:
    if: ${{ !inputs.upload }}
    uses: ./.github/workflows/binaries.yml
    with:
      tag: ${{ inputs.tag }}
      checkout_ref: ${{ inputs.checkout_ref }}
      upload: ${{ inputs.upload }}
    permissions:
      contents: read

  binaries-and-upload:
    if: ${{ inputs.upload }}
    uses: ./.github/workflows/binaries.yml
    with:
      tag: ${{ inputs.tag }}
      checkout_ref: ${{ inputs.checkout_ref }}
      upload: true
    permissions:
      contents: write

name: Build binaries

on:
  workflow_call:
    inputs:
      tag:
        description: Existing release tag
        required: true
        type: string
      checkout_ref:
        description: Source ref to build instead of the release tag
        required: false
        default: ""
        type: string
      upload:
        description: Attach archives to the named GitHub release
        required: false
        default: true
        type: boolean
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag
        required: true
        type: string
      checkout_ref:
        description: Source ref to build instead of the release tag
        required: false
        default: ""
        type: string
      upload:
        description: Attach archives to the named GitHub release
        required: false
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  build:
    permissions:
      contents: write
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            asset-name: workfold-linux-ubuntu-22.04
          - os: macos-15
            asset-name: workfold-macos-15
          - os: windows-2022
            asset-name: workfold-windows-2022
    steps:
      - name: Select tag
        shell: bash
        env:
          REQUESTED_TAG: ${{ inputs.tag }}
        run: |
          if [[ ! "$REQUESTED_TAG" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z]+)*$ ]]; then
            echo "Expected a semantic-version release tag, got: $REQUESTED_TAG" >&2
            exit 2
          fi
          echo "RELEASE_TAG=$REQUESTED_TAG" >> "$GITHUB_ENV"
          RAW_ARCH="$(uname -m)"
          case "$RAW_ARCH" in
            x86_64|amd64) BINARY_ARCH=x86_64 ;;
            aarch64|arm64) BINARY_ARCH=arm64 ;;
            *) BINARY_ARCH="$RAW_ARCH" ;;
          esac
          echo "BINARY_ARCH=$BINARY_ARCH" >> "$GITHUB_ENV"
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.checkout_ref || inputs.tag }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - run: python -m pip install pyinstaller .
      - run: pyinstaller --noconfirm --clean --paths . --name workfold workfold/__main__.py
      - name: Add project and dependency notices
        run: python .github/scripts/prepare_binary_bundle.py dist/workfold
      - name: Verify version
        shell: bash
        env:
          UPLOAD_RELEASE: ${{ inputs.upload }}
        run: |
          if [ "$UPLOAD_RELEASE" = true ]; then
            TAG_VERSION="${RELEASE_TAG#v}"
            EXPECTED="$(python -c 'import sys; from packaging.version import Version; print(Version(sys.argv[1]))' "$TAG_VERSION")"
          else
            EXPECTED="$(python -c 'from importlib.metadata import version; print(version("workfold"))')"
          fi
          if [ "${{ runner.os }}" = Windows ]; then
            BINARY=dist/workfold/workfold.exe
          else
            BINARY=dist/workfold/workfold
          fi
          test "$("$BINARY" --version)" = "workfold $EXPECTED"
          FIXTURE="$(mktemp -d)"
          git -C "$FIXTURE" init --initial-branch=main
          git -C "$FIXTURE" config user.name "CI Fixture"
          git -C "$FIXTURE" config user.email "ci@example.test"
          echo activity > "$FIXTURE/work.txt"
          git -C "$FIXTURE" add work.txt
          GIT_AUTHOR_DATE="2026-08-03T10:00:00+02:00" GIT_COMMITTER_DATE="2026-08-03T10:00:00+02:00" git -C "$FIXTURE" commit -m "fixture activity"
          "$BINARY" "$FIXTURE" --time all --timezone Europe/Berlin --no-color > binary-report.txt
          grep -Eq '^Events[[:space:]]+1[[:space:]]' binary-report.txt
          NO_COLOR=1 "$BINARY" "$FIXTURE" --mode all --time all --fs-times modified --timezone Europe/Berlin --strict --coverage > combined-report.txt
          grep -Eq '^Events[[:space:]]+2[[:space:]]' combined-report.txt
          grep -F "Git commits discovered: 1" combined-report.txt
          grep -F "filesystem entries discovered: 1" combined-report.txt
          python -c 'from pathlib import Path; assert b"\x1b" not in Path("combined-report.txt").read_bytes()'
          test -f dist/workfold/LICENSE
          test -f dist/workfold/README.md
          test -f dist/workfold/THIRD_PARTY_NOTICES.md
          test -n "$(find dist/workfold/licenses -type f -print -quit)"
          NON_REPOSITORY="$(mktemp -d)"
          if "$BINARY" "$NON_REPOSITORY" --timezone Europe/Berlin >/dev/null 2>&1; then
            echo "Expected a non-repository Git target to fail" >&2
            exit 1
          else
            test "$?" -eq 2
          fi
      - name: Package binary (Unix)
        if: runner.os != 'Windows'
        id: package_unix
        shell: bash
        run: |
          ARCHIVE="dist/${{ matrix.asset-name }}-${BINARY_ARCH}-${RELEASE_TAG}.tar.gz"
          tar -czf "$ARCHIVE" -C dist workfold
          CHECKSUM="$ARCHIVE.sha256"
          shasum -a 256 "$ARCHIVE" > "$CHECKSUM"
          echo "archive=$ARCHIVE" >> "$GITHUB_OUTPUT"
          echo "checksum=$CHECKSUM" >> "$GITHUB_OUTPUT"
      - name: Package binary (Windows)
        if: runner.os == 'Windows'
        id: package_windows
        shell: pwsh
        run: |
          $archive = "dist/${{ matrix.asset-name }}-$env:BINARY_ARCH-$env:RELEASE_TAG.zip"
          Compress-Archive -Path "dist/workfold/*" -DestinationPath $archive
          $checksum = "$archive.sha256"
          $hash = (Get-FileHash -Algorithm SHA256 $archive).Hash.ToLowerInvariant()
          "$hash  $([IO.Path]::GetFileName($archive))" | Set-Content -Encoding ascii $checksum
          "archive=$archive" >> $env:GITHUB_OUTPUT
          "checksum=$checksum" >> $env:GITHUB_OUTPUT
      - uses: softprops/action-gh-release@v3
        if: inputs.upload
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: |
            ${{ steps.package_unix.outputs.archive || steps.package_windows.outputs.archive }}
            ${{ steps.package_unix.outputs.checksum || steps.package_windows.outputs.checksum }}
          fail_on_unmatched_files: true

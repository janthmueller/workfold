[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "workfold"
version = "0.1.0-alpha.3"
description = "Fold local Git and filesystem timestamp activity onto a representative week."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "pathspec>=1,<2",
    "rich>=14,<15",
    "tomli>=2.2,<3; python_version < '3.11'",
    "tzdata>=2025.2; sys_platform == 'win32'",
    "tzlocal>=5,<6",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

[[project.authors]]
name = "Jan T. Müller"
email = "mail@jantmueller.com"

[project.urls]
homepage = "https://github.com/janthmueller/workfold"
documentation = "https://janthmueller.github.io/workfold/"
source = "https://github.com/janthmueller/workfold"
tracker = "https://github.com/janthmueller/workfold/issues"

[project.scripts]
workfold = "workfold.cli:main"

[project.optional-dependencies]
dev = [
    "pyright>=1.1",
    "pytest>=8",
    "pytest-cov>=6",
    "ruff>=0.8",
    "tomli>=2.2,<3",
]
release = [
    "build>=1",
    "pyinstaller>=6",
    "python-semantic-release>=10,<11",
    "twine>=5",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["workfold*"]
exclude = ["tests*"]

[tool.setuptools.package-data]
workfold = ["py.typed"]

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["workfold", "tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.pyright]
pythonVersion = "3.10"
typeCheckingMode = "strict"
include = ["workfold", "tests"]
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
addopts = ["-ra", "--strict-config", "--strict-markers"]
pythonpath = ["tests"]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["workfold"]
omit = ["workfold/__main__.py"]

[tool.coverage.report]
fail_under = 90
show_missing = true

[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]
assets = ["uv.lock"]
commit_parser = "conventional"
allow_zero_version = true
major_on_zero = false
commit_message = "chore(release): {version} [skip ci]\n\nAutomatically generated by python-semantic-release"
build_command = "python .github/scripts/sync_lock_version.py \"$NEW_VERSION\" && python -m build"

[tool.semantic_release.branches.main]
match = "main"
prerelease = false

[tool.semantic_release.publish]
upload_to_vcs_release = true
